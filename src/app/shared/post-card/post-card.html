<div class="post-card theme-transition">
  <div class="card-header">
    <div class="user-section">
      <div class="avatar">{{ post.user.charAt(0).toUpperCase() }}</div>
      <div class="user-info">
        <h3>{{ post.user }}</h3>
        <span class="time">{{ post.createdAt | timeAgo }}</span>
      </div>
    </div>
    <app-post-options 
      [postId]="post.id" 
      [userId]="post.user"
      (optionSelected)="onOptionSelected($event)">
    </app-post-options>
  </div>
  <img [src]="post.image" [alt]="'Logro de ' + post.user" class="post-image">
  <div class="card-body">
    <p class="post-text">{{ post.text }}</p>
    <div class="card-footer">
      <button class="like-btn" [class.liked]="isLiked" (click)="toggleLike()">
        <span class="heart">{{ isLiked ? '❤️' : '🤍' }}</span>
        <span class="count">{{ post.likes }}</span>
      </button>
      <div class="action-buttons">
        <button class="action-btn" title="Comentar">
          💬
        </button>
        <button class="action-btn" title="Compartir">
          📤
        </button>
      </div>
    </div>
  </div>
</div>
