<div class="auth-container">
  <div class="auth-form">
    <h2>Iniciar sesión</h2>
    
    <div class="input-group">
      <label for="email">Email *</label>
      <input 
        id="email"
        [(ngModel)]="email" 
        placeholder="usuario@gmail.com" 
        type="email"
        autocomplete="email"
        (blur)="validateEmail()"
        [class.input-error]="emailError">
      @if (emailError) {
        <span class="error-message">{{ emailError }}</span>
      }
    </div>

    <div class="input-group">
      <label for="password">Contraseña *</label>
      <input 
        id="password"
        [(ngModel)]="password" 
        placeholder="••••••••" 
        type="password"
        autocomplete="current-password">
    </div>

    @if (serverError) {
      <div class="server-error" style="color: #e74c3c; margin-bottom: 16px; text-align: center; font-size: 14px; font-weight: 500;">
        {{ serverError }}
      </div>
    }

    <button (click)="login()" class="btn-primary" [disabled]="isLoading" [style.opacity]="isLoading ? '0.7' : '1'">
      {{ isLoading ? 'Conectando...' : 'Entrar' }}
    </button>
    
    <p class="auth-footer">
      ¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a>
    </p>
  </div>
</div>
