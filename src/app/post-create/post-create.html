<app-navbar></app-navbar>

<div class="create-post-container">
  <div class="create-post">
    <h2>Comparte tu logro ᯓ★</h2>
    
    <div class="form-content">
      
      <div class="form-group">
        <label class="section-label">¿Qué reto has completado?</label>
        <select 
            [(ngModel)]="selectedChallengeId" 
            name="challengeId" 
            class="challenge-select" 
            (change)="onChallengeSelected()"
            [disabled]="isSubmitting">
          <option value="" disabled selected>Selecciona un reto completado</option>
          @for (challenge of availableChallenges; track challenge.id) {
            <option [value]="challenge.id">
                {{ challenge.title }} ({{ getCategoryName(challenge.category) }} - +{{ challenge.points }} ⚡)
            </option>
          }
        </select>
      </div>

      <div class="form-group">
        <label class="section-label">Tu experiencia</label>
        <textarea 
          [(ngModel)]="text" 
          name="text" 
          placeholder="Describe tu logro saludable del día... ¿Qué has conseguido hoy?"
          maxlength="250"
          rows="5"
          [disabled]="isSubmitting"></textarea>
          <small class="char-counter">{{ text.length || 0 }}/250 caracteres</small>
      </div>

      <div class="form-group">
        <label class="section-label">Foto del logro</label>
        
        <div class="image-upload-area" 
             [class.has-image]="selectedImage" 
             (click)="!isSubmitting && fileInput.click()">
             
          <input 
            #fileInput 
            type="file" 
            accept="image/*" 
            (change)="onImageSelected($event)" 
            hidden
            [disabled]="isSubmitting">

          @if (selectedImage) {
            <div class="image-preview-wrapper">
              <img [src]="selectedImage" alt="Preview">
              <button class="remove-btn" (click)="removeImage(); $event.stopPropagation()" [disabled]="isSubmitting">✕</button>
            </div>
          } @else {
            <div class="upload-placeholder">
              <span>Haz clic para subir una foto</span>
            </div>
          }
        </div>
      </div>

      @if (selectedChallenge) {
        <div class="challenge-summary-card" [ngClass]="selectedChallenge.category">
          <div class="summary-icon-box">
            {{ getCategoryIcon(selectedChallenge.category) }}
          </div>
          <div class="summary-info">
            <span class="summary-label">Reto Completado</span>
            <span class="summary-title">{{ selectedChallenge.title }}</span>
          </div>
          <div class="summary-points">
            +{{ selectedChallenge.points }} ⚡
          </div>
        </div>
      }

      <div class="form-actions">
        <button 
            class="btn-submit" 
            (click)="submit()" 
            [disabled]="isSubmitting || !selectedImage || !text.trim() || !selectedChallengeId"
            [class.loading]="isSubmitting">
            
            @if (isSubmitting) {
                <span> Publicando...</span>
            } @else {
                <span> Publicar Logro</span>
            }
        </button>
      </div>

    </div>
  </div>
</div>
