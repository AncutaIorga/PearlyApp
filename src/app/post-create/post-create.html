<app-navbar></app-navbar>
<div class="create-post-container">
  <div class="create-post">
    <h2>Comparte tu logro 🌟</h2>
    <form (ngSubmit)="submit()">
      <!-- Sección de Imagen -->
      <div class="form-group">
        <div class="image-upload-container">
          <input 
            type="file" 
            id="imageInput" 
            accept="image/*" 
            (change)="onImageSelected($event)">
          @if (selectedImage) {
            <div class="image-preview">
              <img [src]="selectedImage" alt="Preview">
              <button type="button" class="remove-image" (click)="removeImage()">✕</button>
            </div>
          }
        </div>
      </div>
      <!-- Sección de Descripción -->
      <div class="form-group">
        <textarea 
          [(ngModel)]="text" 
          name="text" 
          placeholder="Describe tu logro saludable del día... ¿Qué has conseguido hoy?"
          rows="6"></textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-primary">Publicar logro</button>
      </div>
    </form>
  </div>
</div>
