<app-navbar></app-navbar>

<div class="feed-container theme-transition">
  <div class="feed">
    @if (posts.length === 0) {
      <p class="empty-feed">No hay publicaciones todavía</p>
    } @else {
      @for (post of posts; track post.id) {
        <app-post-card [post]="post"></app-post-card>
      }
    }
  </div>
</div>
