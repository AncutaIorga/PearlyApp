<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PearlyApp</title>
  
  <script>
    // Si la app se carga desde un archivo local (Electron), 
    // ajustamos el base href dinámicamente para que encuentre los assets.
    (function() {
      var base = document.location.pathname.endsWith('index.html') 
                 ? document.location.pathname.replace('index.html', '') 
                 : './';
      document.write('<base href="' + base + '" />');
    })();
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
</body>
</html>
